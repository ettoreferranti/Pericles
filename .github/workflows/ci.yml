name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONPATH: tools

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Long tests (whole-village runs)
        run: uv run pytest -m long
      - name: Traceability
        run: uv run python -m pericles_tools.traceability check
      - name: ADRs
        run: uv run python -m pericles_tools.adr check
      - name: Traceability matrix
        run: uv run python -m pericles_tools.traceability matrix
      - uses: actions/upload-artifact@v4
        if: matrix.python == '3.12'
        with:
          name: traceability-matrix
          path: docs/requirements/traceability.md

  mutation:
    if: github.event_name == 'pull_request'
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: uv sync --locked
      - name: Mutation testing (changed modules)
        # two workers keep mutmut within the runner's memory (4 workers were killed, exit 143)
        run: uv run python -m pericles_tools.mutation_gate run --changed-since origin/${{ github.base_ref }} --max-children 2
      - name: Viewer mutation testing (if viewer changed)
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^viewer/src/'; then
            cd viewer && pnpm install --frozen-lockfile && pnpm mutation
          else
            echo "viewer unchanged; skipping Stryker"
          fi

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
