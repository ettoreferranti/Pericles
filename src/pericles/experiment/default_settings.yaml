# Playable defaults for every engine parameter (ADR-0015 §11). Copy this file to tweak a run.
engine:
  calendar:
    tick_minutes: 1
    day_minutes: 1440
    sunrise_minute: 360
    sunset_minute: 1200
    seasons:
      - {name: spring, days: 10}
      - {name: summer, days: 10}
      - {name: autumn, days: 10}
      - name: winter
        days: 10
        blocked_tags: [sowing]
        modifiers:
          - {target: {kind: need, id: hunger}, attribute: rate, op: mul, value: 1.5}
          - {target: {kind: need, id: cold}, attribute: rate, op: mul, value: 6.0}
  carry_limit: 30.0
  max_skill: 100.0
  skill_practice: 1.0
  skill_speed_per_level: 0.005
  debug_invariants: false
  max_health: 100.0
  health_regen_per_hour: 1.0
  sleep_relief_per_hour: 12.0
  home_sleep_multiplier: 2.0
  shelter_relief_per_hour: 20.0
  sexes: [female, male]
  bearing_sex: female
  adult_age_days: 120
  old_age_days: 600
  old_age_death_chance: 0.002
  old_age_death_growth: 1.02
  gestation_days: 10
  birth_interval_days: 10
  conception_chance_per_day: 0.2
  birth_food_per_capita: 50.0
  couple_proposal_ttl_ticks: 60
  model_rule: inherit
  adult_model: null
  child_names: []
  child_intents: [move_to, wait, start_action, eat, sleep, take, deposit]
  child_action_tags: [light]
  family_events: [born, died, couple_formed, came_of_age]
  village_events: [building_completed, technology_learned]
  childhood_memory_limit: 20

# Scripted villagers (ADR-0016). Levels are need levels on the 0..critical scale.
agents:
  act_at: {eat: 50.0, sleep: 75.0, shelter: 60.0}
  urgent_at: {eat: 85.0, sleep: 95.0, shelter: 85.0}
  warm_until: 10.0
  food_carry: 60.0
  deposit_load: 0.7
  food_reserve_per_capita: 60.0
  storage_per_capita: 15.0
  skill_weight: 1.0
  house_building: house
  store_building: storehouse
  site_search_radius: 12
  site_gap: 1
  max_builders: 3
  node_search_radius: 48
  index_cell: 8
  avoid_ticks: 240
  idle_ticks: 15
  child_follow_radius: 4
  couples: true
